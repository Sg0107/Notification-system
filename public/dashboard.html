<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Notification Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0f1216;
    --panel: #171b21;
    --border: #2a2f37;
    --text: #e6e8eb;
    --muted: #8b929c;
    --accent: #5b8def;
    --ok: #3fb950;
    --warn: #d29922;
    --bad: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 24px; }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .card .value { font-size: 26px; font-weight: 600; margin-top: 4px; }
  .card.sent .value { color: var(--ok); }
  .card.retrying .value { color: var(--warn); }
  .card.dead_lettered .value { color: var(--bad); }

  .channel-breakdown {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 24px;
  }
  .channel-breakdown h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); font-weight: 600; }
  .channel-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; }
  .channel-row .name { width: 60px; text-transform: capitalize; }
  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 999px; background: #1f242c; font-size: 12px;
  }
  .pill.sent { color: var(--ok); }
  .pill.retrying { color: var(--warn); }
  .pill.dead_lettered { color: var(--bad); }
  .pill.queued { color: var(--accent); }

  .controls { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  select, button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .controls .spacer { flex: 1; }
  .controls .meta { color: var(--muted); font-size: 12px; }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { padding: 8px 12px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  tr:last-child td { border-bottom: none; }
  .status-badge { padding: 2px 8px; border-radius: 999px; font-size: 11px; background: #1f242c; }
  .status-badge.sent { color: var(--ok); }
  .status-badge.retrying { color: var(--warn); }
  .status-badge.dead_lettered { color: var(--bad); }
  .status-badge.queued { color: var(--accent); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); }
  .empty { padding: 24px; text-align: center; color: var(--muted); }

  .pagination { display: flex; gap: 8px; align-items: center; margin-top: 12px; justify-content: flex-end; }

  .send-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 24px;
  }
  .send-panel h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); font-weight: 600; }
  .send-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    margin-bottom: 10px;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  input, textarea {
    background: #0f1216;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 36px; }
  .channel-checks { display: flex; gap: 16px; align-items: center; }
  .channel-checks label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; text-transform: none; }
  .channel-checks input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; }
  .recipient-field { display: none; }
  .recipient-field.active { display: flex; }
  .field .hint { font-size: 11px; color: var(--muted); font-weight: normal; text-transform: none; letter-spacing: normal; }
  .send-actions { display: flex; align-items: center; gap: 10px; }
  .send-actions button[type="submit"] {
    background: var(--accent);
    border-color: var(--accent);
    color: #0b1220;
    font-weight: 600;
  }
  .send-feedback { font-size: 13px; }
  .send-feedback.ok { color: var(--ok); }
  .send-feedback.err { color: var(--bad); }
</style>
</head>
<body>
  <h1>Notification Dashboard</h1>
  <div class="subtitle">Read-only view over the <span class="mono">notifications</span> collection. Refreshes every 5s.</div>

  <div class="cards" id="cards"></div>
  <div class="channel-breakdown" id="channelBreakdown"></div>

  <div class="send-panel">
    <h2>Send a notification</h2>
    <form id="sendForm">
      <div class="send-grid">
        <div class="field">
          <label>Channels</label>
          <div class="channel-checks">
            <label><input type="checkbox" class="channel-check" value="email" checked /> Email</label>
            <label><input type="checkbox" class="channel-check" value="sms" /> SMS</label>
            <label><input type="checkbox" class="channel-check" value="push" /> Push</label>
          </div>
        </div>
        <div class="field">
          <label for="sendPriority">Priority</label>
          <select id="sendPriority">
            <option value="high">High</option>
            <option value="normal" selected>Normal</option>
            <option value="low">Low</option>
          </select>
        </div>
      </div>
      <div class="send-grid">
        <div class="field recipient-field" id="emailRecipientField">
          <label for="emailRecipients">Email address(es) <span class="hint">- comma or newline separated</span></label>
          <textarea id="emailRecipients" placeholder="a@example.com, b@example.com"></textarea>
        </div>
        <div class="field recipient-field" id="smsRecipientField">
          <label for="smsRecipients">Phone number(s) <span class="hint">- comma or newline separated</span></label>
          <textarea id="smsRecipients" placeholder="+15551234567, +15557654321"></textarea>
        </div>
        <div class="field recipient-field" id="pushRecipientField">
          <label for="pushRecipients">Device token(s) <span class="hint">- comma or newline separated</span></label>
          <textarea id="pushRecipients" placeholder="device-token-abc, device-token-def"></textarea>
        </div>
      </div>
      <div class="send-grid">
        <div class="field">
          <label for="sendSubject">Subject <span class="hint">- used as the email subject, or as a headline prefixed onto the SMS body</span></label>
          <input id="sendSubject" type="text" placeholder="(no subject)" />
        </div>
      </div>
      <div class="send-grid">
        <div class="field" style="grid-column: 1 / -1;">
          <label for="sendBody">Message</label>
          <textarea id="sendBody" placeholder="Notification body..."></textarea>
        </div>
      </div>
      <div class="send-actions">
        <button type="submit">Send notification</button>
        <span class="send-feedback" id="sendFeedback"></span>
      </div>
    </form>
  </div>

  <div class="controls">
    <select id="channelFilter">
      <option value="">All channels</option>
      <option value="email">Email</option>
      <option value="sms">SMS</option>
      <option value="push">Push</option>
    </select>
    <select id="statusFilter">
      <option value="">All statuses</option>
      <option value="queued">Queued</option>
      <option value="retrying">Retrying</option>
      <option value="sent">Sent</option>
      <option value="dead_lettered">Dead lettered</option>
    </select>
    <div class="spacer"></div>
    <span class="meta" id="rangeLabel"></span>
    <button id="refreshBtn">Refresh now</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Created</th>
        <th>Channel</th>
        <th>Priority</th>
        <th>Recipient</th>
        <th>Status</th>
        <th>Attempts</th>
        <th>Last error</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="emptyState" style="display:none;">No notifications match this filter yet.</div>

  <div class="pagination">
    <button id="prevBtn">&larr; Prev</button>
    <button id="nextBtn">Next &rarr;</button>
  </div>

<script>
  const PAGE_SIZE = 20;
  let skip = 0;
  let autoRefreshTimer = null;

  const channelFilter = document.getElementById('channelFilter');
  const statusFilter = document.getElementById('statusFilter');

  function fmtDate(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    return d.toLocaleString();
  }

  function escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  async function loadStats() {
    const res = await fetch('/api/dashboard/stats');
    const stats = await res.json();

    const statuses = ['queued', 'retrying', 'sent', 'dead_lettered'];
    const cardsEl = document.getElementById('cards');
    cardsEl.innerHTML = `
      <div class="card">
        <div class="label">Total</div>
        <div class="value">${stats.total || 0}</div>
      </div>
      ${statuses.map((s) => `
        <div class="card ${s}">
          <div class="label">${s.replace('_', ' ')}</div>
          <div class="value">${stats.byStatus?.[s] || 0}</div>
        </div>
      `).join('')}
    `;

    const channelEl = document.getElementById('channelBreakdown');
    const channels = Object.keys(stats.byChannel || {});
    if (channels.length === 0) {
      channelEl.innerHTML = '<h2>Per channel</h2><div class="meta" style="color:var(--muted)">No data yet.</div>';
    } else {
      channelEl.innerHTML = '<h2>Per channel</h2>' + channels.map((ch) => {
        const counts = stats.byChannel[ch];
        const pills = Object.entries(counts)
          .map(([status, n]) => `<span class="pill ${status}">${status}: ${n}</span>`)
          .join('');
        return `<div class="channel-row"><span class="name">${ch}</span>${pills}</div>`;
      }).join('');
    }
  }

  async function loadTable() {
    const params = new URLSearchParams({ limit: PAGE_SIZE, skip });
    if (channelFilter.value) params.set('channel', channelFilter.value);
    if (statusFilter.value) params.set('status', statusFilter.value);

    const res = await fetch(`/api/dashboard/notifications?${params}`);
    const data = await res.json();

    const rowsEl = document.getElementById('rows');
    const emptyEl = document.getElementById('emptyState');

    if (!data.items || data.items.length === 0) {
      rowsEl.innerHTML = '';
      emptyEl.style.display = 'block';
    } else {
      emptyEl.style.display = 'none';
      rowsEl.innerHTML = data.items.map((n) => `
        <tr>
          <td class="mono">${fmtDate(n.createdAt)}</td>
          <td>${escapeHtml(n.channel)}</td>
          <td>${escapeHtml(n.priority)}</td>
          <td class="mono">${escapeHtml(n.recipient)}</td>
          <td><span class="status-badge ${n.status}">${escapeHtml(n.status)}</span></td>
          <td>${n.attempts ?? 0}</td>
          <td class="mono">${escapeHtml(n.lastError) || '-'}</td>
        </tr>
      `).join('');
    }

    const from = data.total === 0 ? 0 : skip + 1;
    const to = Math.min(skip + PAGE_SIZE, data.total);
    document.getElementById('rangeLabel').textContent = `${from}-${to} of ${data.total}`;
    document.getElementById('prevBtn').disabled = skip === 0;
    document.getElementById('nextBtn').disabled = to >= data.total;
  }

  async function loadAll() {
    await Promise.all([loadStats(), loadTable()]);
  }

  document.getElementById('prevBtn').addEventListener('click', () => {
    skip = Math.max(0, skip - PAGE_SIZE);
    loadTable();
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    skip += PAGE_SIZE;
    loadTable();
  });
  document.getElementById('refreshBtn').addEventListener('click', loadAll);
  channelFilter.addEventListener('change', () => { skip = 0; loadTable(); });
  statusFilter.addEventListener('change', () => { skip = 0; loadTable(); });

  // --- Send notification form -----------------------------------------
  // Posts straight to the same POST /api/notifications the real API
  // clients use - no special "admin" endpoint, this is just a form in
  // front of the public API, so it exercises the exact same idempotency/
  // validation path everything else goes through.
  //
  // Channels are multi-select (checkboxes) and each channel's recipient
  // field accepts multiple comma/newline-separated values, so one submit
  // can fan out into several real notifications - e.g. email to 3
  // addresses AND sms to 2 numbers at once. Each of those is a genuinely
  // separate notification (its own recipient, its own eventual
  // sent/failed outcome), so each needs its OWN idempotency key - that
  // key is generated fresh per request, right before it's sent, and is
  // never shown or editable in the UI. There's nothing for the user to
  // manage: a key only exists to let the API tell "retry of the same
  // thing" apart from "a new thing that happens to look the same," and a
  // key typed into a form and reused across submits would silently turn
  // every later send into a rejected duplicate.

  const sendFeedback = document.getElementById('sendFeedback');
  const channelChecks = Array.from(document.querySelectorAll('.channel-check'));

  const CHANNEL_CONFIG = {
    email: { fieldId: 'emailRecipientField', inputId: 'emailRecipients' },
    sms: { fieldId: 'smsRecipientField', inputId: 'smsRecipients' },
    push: { fieldId: 'pushRecipientField', inputId: 'pushRecipients' },
  };

  function newIdempotencyKey() {
    const rand = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    return `dashboard-${rand}`;
  }

  // Splits on commas AND newlines, trims each piece, drops empties - so
  // "a@x.com, b@x.com" and one-per-line both work.
  function parseRecipients(raw) {
    return raw.split(/[,\n]/).map((s) => s.trim()).filter(Boolean);
  }

  function applyChannelFields() {
    for (const check of channelChecks) {
      const cfg = CHANNEL_CONFIG[check.value];
      document.getElementById(cfg.fieldId).classList.toggle('active', check.checked);
    }
  }

  // Shapes the payload the way each channel's provider actually reads it.
  // emailProvider reads subject/body directly. smsProvider only reads
  // body - there's no separate subject slot on an SMS, so "subject" is
  // folded in as a headline line on top of the body instead. pushProvider
  // reads title/body, so subject maps onto title there.
  function buildPayload(channel, subject, body) {
    if (channel === 'email') return { subject: subject || '(no subject)', body };
    if (channel === 'push') return { title: subject || undefined, body };
    // sms
    return { body: subject ? `${subject}\n${body}` : body };
  }

  async function sendOne(channel, recipient, priority, subject, body) {
    const idempotencyKey = newIdempotencyKey();
    const res = await fetch('/api/notifications', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        channel,
        priority,
        recipient,
        payload: buildPayload(channel, subject, body),
        idempotencyKey,
      }),
    });
    return { channel, recipient, status: res.status };
  }

  channelChecks.forEach((c) => c.addEventListener('change', applyChannelFields));

  document.getElementById('sendForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    sendFeedback.textContent = '';
    sendFeedback.className = 'send-feedback';

    const selectedChannels = channelChecks.filter((c) => c.checked).map((c) => c.value);
    const priority = document.getElementById('sendPriority').value;
    const subject = document.getElementById('sendSubject').value;
    const body = document.getElementById('sendBody').value;

    if (selectedChannels.length === 0) {
      sendFeedback.textContent = 'Select at least one channel.';
      sendFeedback.className = 'send-feedback err';
      return;
    }

    // One (channel, recipient) pair per actual notification to send.
    const tasks = [];
    for (const channel of selectedChannels) {
      const recipients = parseRecipients(document.getElementById(CHANNEL_CONFIG[channel].inputId).value);
      if (recipients.length === 0) {
        sendFeedback.textContent = `${channel} is selected but has no recipients.`;
        sendFeedback.className = 'send-feedback err';
        return;
      }
      for (const recipient of recipients) tasks.push({ channel, recipient });
    }

    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;

    try {
      const results = await Promise.allSettled(
        tasks.map((t) => sendOne(t.channel, t.recipient, priority, subject, body))
      );

      const queued = results.filter((r) => r.status === 'fulfilled' && r.value.status === 202).length;
      const failed = results.length - queued;

      if (failed === 0) {
        sendFeedback.textContent = `Queued ${queued} notification${queued === 1 ? '' : 's'}.`;
        sendFeedback.className = 'send-feedback ok';
      } else {
        sendFeedback.textContent = `Queued ${queued}, ${failed} failed - check the worker/API logs for details.`;
        sendFeedback.className = 'send-feedback err';
      }

      skip = 0;
      loadAll();
    } finally {
      submitBtn.disabled = false;
    }
  });

  applyChannelFields();

  loadAll();
  autoRefreshTimer = setInterval(loadAll, 5000);
</script>
</body>
</html>
